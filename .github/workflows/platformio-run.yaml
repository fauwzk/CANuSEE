name: PlatformIO CI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    # To go back to GitHub-hosted, uncomment the line below and comment out 'self-hosted'
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      # Commented out for self-hosted to use the server's native Python
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.11'

      # Modified to use native Python, a virtual environment, and inject it into the runner's PATH
      - name: Install PlatformIO (Self-Hosted Venv)
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install --upgrade platformio
          echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

      - name: Get short SHA and expose to PlatformIO
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "GIT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Clean previous build
        run: pio run -t clean
      
      - name: Build firmware
        run: pio run -e esp32c3 -v

      - name: Build LittleFS
        run: pio run -e esp32c3 -t buildfs

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          # On renomme simplement firmware.bin sans le SHA pour garder un lien fixe !
          cp .pio/build/esp32c3/firmware.bin release/firmware.bin
          cp .pio/build/esp32c3/littlefs.bin release/littlefs.bin
          
      - name: Create zip release
        run: |
          cd release
          # On garde le zip pour toi
          zip firm_fs-${{ steps.sha.outputs.short }}.zip firmware.bin littlefs.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: Build ${{ steps.sha.outputs.short }}
          files: |
            release/*.zip
            release/firmware.bin
            release/littlefs.bin

      - name: Send Discord Webhook
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_SECRET }}
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.sha.outputs.short }}"
          FW_URL="$BASE_URL/firmware.bin"
          FS_URL="$BASE_URL/littlefs.bin"
          ZIP_URL="$BASE_URL/firm_fs-${{ steps.sha.outputs.short }}.zip"

          curl -H "Content-Type: application/json" \
               -d "{
                 \"username\": \"GitHub Actions\",
                 \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
                 \"embeds\": [{
                   \"title\": \"🚀 New ESP32 Build Ready: ${{ steps.sha.outputs.short }}\",
                   \"color\": 5814783,
                   \"description\": \"The latest firmware and filesystem binaries have been compiled and attached to the release.\",
                   \"fields\": [
                     {
                       \"name\": \"Firmware\",
                       \"value\": \"[⬇️ Download Firmware.bin]($FW_URL)\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"LittleFS\",
                       \"value\": \"[⬇️ Download LittleFS.bin]($FS_URL)\",
                       \"inline\": true
                     },
                     {
                       \"name\": \"Archive\",
                       \"value\": \"[📦 Download ZIP]($ZIP_URL)\",
                       \"inline\": false
                     }
                   ]
                 }]
               }" \
               $DISCORD_WEBHOOK